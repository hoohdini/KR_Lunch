name: 권역 인구 갱신

on:
  schedule:
    # 평일 09:00–18:59 KST, 10분마다 (GitHub cron은 UTC)
    - cron: "*/10 0-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-seoul
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 서울시 API 호출
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python3 scripts/fetch_seoul.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC 갱신"
            git pull --rebase origin main
            git push
          fi
