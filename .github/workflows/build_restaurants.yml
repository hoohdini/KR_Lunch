name: 식당 전수 목록 갱신

on:
  schedule:
    # 매월 2일 03:10 KST (UTC 1일 18:10)
    - cron: "10 18 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-restaurants
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyproj

      - name: 인허가 데이터 조회 → data/restaurants.json
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python3 scripts/build_restaurants.py

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 식당 전수 목록 갱신 $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
